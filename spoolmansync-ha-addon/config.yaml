name: SpoolmanSync (auto-create)
version: "1.6.14.2"
slug: spoolmansync-ha-addon
description: SpoolmanSync fork that also adds Bambu RFID spools from the AMS to Spoolman automatically
url: https://github.com/suncy1983-hash/SpoolmanSync
# No prebuilt image: the Supervisor builds this add-on locally from Dockerfile.
arch:
  - aarch64
  - amd64

# Ingress (web UI in HA sidebar)
ingress: true
ingress_port: 0
panel_icon: mdi:target
panel_title: SpoolmanSync

# API access for connecting to HA
homeassistant_api: true
hassio_api: true
auth_api: true

# Map HA config directory so addon can write automations.yaml and configuration.yaml
map:
  - config:rw

# User-configurable options (all optional, configurable from the UI)
options:
  port: 3000
schema:
  spoolman_url: url?
  port: "int(1024,65535)?"

# Use host network so the add-on can reach services on Tailscale, VPNs, etc.
host_network: true

# Startup configuration
startup: application
boot: auto
